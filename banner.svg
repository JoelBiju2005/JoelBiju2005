<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Joel Biju. Full-stack, machine learning and optimisation." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="0.6" stop-color="#080808"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <!-- Shimmer that sweeps across the title -->
    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="-500" y1="0" x2="-100" y2="0" spreadMethod="pad">
      <stop offset="0" stop-color="#7a7a7a"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7a7a7a"/>
      <animate attributeName="x1" values="-500;1300" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-100;1700" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Light beam and scan line -->
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Slow vertical light beam -->
  <rect y="0" width="220" height="300" fill="url(#beam)">
    <animateTransform attributeName="transform" type="translate" from="-260 0" to="1240 0" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Floating particles -->
  <g fill="#ffffff">
    <circle cx="90"   cy="320" r="1.4" opacity="0.5"><animate attributeName="cy" from="320" to="-20" dur="9s"  begin="0s"   repeatCount="indefinite"/></circle>
    <circle cx="200"  cy="320" r="1"   opacity="0.4"><animate attributeName="cy" from="320" to="-20" dur="12s" begin="2s"   repeatCount="indefinite"/></circle>
    <circle cx="310"  cy="320" r="1.8" opacity="0.35"><animate attributeName="cy" from="320" to="-20" dur="10s" begin="4s"   repeatCount="indefinite"/></circle>
    <circle cx="430"  cy="320" r="1.2" opacity="0.5"><animate attributeName="cy" from="320" to="-20" dur="11s" begin="1s"   repeatCount="indefinite"/></circle>
    <circle cx="540"  cy="320" r="1"   opacity="0.4"><animate attributeName="cy" from="320" to="-20" dur="13s" begin="5s"   repeatCount="indefinite"/></circle>
    <circle cx="660"  cy="320" r="1.6" opacity="0.45"><animate attributeName="cy" from="320" to="-20" dur="9s"  begin="3s"   repeatCount="indefinite"/></circle>
    <circle cx="770"  cy="320" r="1.1" opacity="0.5"><animate attributeName="cy" from="320" to="-20" dur="12s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="880"  cy="320" r="1.9" opacity="0.3"><animate attributeName="cy" from="320" to="-20" dur="10s" begin="6s"   repeatCount="indefinite"/></circle>
    <circle cx="990"  cy="320" r="1.2" opacity="0.45"><animate attributeName="cy" from="320" to="-20" dur="14s" begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="320" r="1.5" opacity="0.4"><animate attributeName="cy" from="320" to="-20" dur="11s" begin="7s"   repeatCount="indefinite"/></circle>
    <circle cx="150"  cy="320" r="1"   opacity="0.35"><animate attributeName="cy" from="320" to="-20" dur="15s" begin="8s"   repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="320" r="1.3" opacity="0.4"><animate attributeName="cy" from="320" to="-20" dur="13s" begin="9s"   repeatCount="indefinite"/></circle>
  </g>

  <!-- Corner brackets (pulse) -->
  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="square">
    <path d="M30 70V30H70"/>
    <path d="M1130 30H1170V70"/>
    <path d="M30 230V270H70"/>
    <path d="M1130 270H1170V230"/>
    <animate attributeName="stroke-opacity" values="0.15;0.6;0.15" dur="3.5s" repeatCount="indefinite"/>
  </g>

  <!-- Text -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="98" font-size="17" letter-spacing="10" fill="#6b7280" opacity="0">
      HI, I'M
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.2s" fill="freeze"/>
    </text>

    <!-- Glow layer -->
    <text x="600" y="172" font-size="78" font-weight="800" letter-spacing="6" fill="#ffffff" filter="url(#glow)" opacity="0">
      JOEL BIJU
      <animate attributeName="opacity" values="0;0.22;0.1;0.22" dur="4s" begin="0.4s" repeatCount="indefinite"/>
    </text>

    <!-- Main title with shimmer -->
    <text x="600" y="172" font-size="78" font-weight="800" letter-spacing="6" fill="url(#shimmer)" opacity="0">
      JOEL BIJU
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.4s" fill="freeze"/>
    </text>

    <text x="600" y="214" font-size="17" letter-spacing="6" fill="#9ca3af" opacity="0">
      FULL-STACK  /  MACHINE LEARNING  /  OPTIMISATION<tspan fill="#ffffff">_<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan>
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="1s" fill="freeze"/>
    </text>
  </g>

  <!-- Scan line along the bottom -->
  <rect x="0" y="256" width="1200" height="1" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="0" y="255" width="260" height="3" fill="url(#scan)">
    <animateTransform attributeName="transform" type="translate" from="-260 0" to="1200 0" dur="3.6s" repeatCount="indefinite"/>
  </rect>
</svg>
